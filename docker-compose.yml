services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: numencrm
      POSTGRES_USER: numen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numen -d numencrm"]
      interval: 5s
      retries: 10
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://numen:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/numencrm
      JWT_SECRET: ${JWT_SECRET:-development-only-change-this-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@numen.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-CHANGE_ME_BEFORE_PRODUCTION}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
